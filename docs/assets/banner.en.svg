<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Neruz Page View: your site on many screens at once">
  <style>
    .t{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
    .tick{stroke:#2a3a4c;stroke-width:1}
    .dev{fill:#0E1520;stroke:#304256;stroke-width:2}
    .act{stroke:#00E5FF}
    .blk{fill:#1a2738}
    .hero{fill:#00E5FF;opacity:.18}
    .page{animation:scroll 7s cubic-bezier(.65,0,.35,1) infinite}
    .scan{animation:scan 7s cubic-bezier(.65,0,.35,1) infinite}
    .w{animation:w 7s cubic-bezier(.65,0,.35,1) infinite}
    .blink{animation:blink 1.4s ease-in-out infinite}
    @keyframes scroll{0%,12%{transform:translateY(0)}45%,62%{transform:translateY(-280px)}92%,100%{transform:translateY(0)}}
    @keyframes scan{0%,10%{transform:translateX(0);opacity:0}15%{opacity:1}55%{transform:translateX(560px);opacity:1}62%,100%{transform:translateX(560px);opacity:0}}
    @keyframes w{0%,20%{transform:scaleX(.35)}50%,80%{transform:scaleX(1)}100%{transform:scaleX(.35)}}
    @keyframes blink{50%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){.page,.scan,.w,.blink{animation:none}}
  </style>
  <defs>
    <clipPath id="cp"><rect x="0" y="0" width="92" height="190" rx="2"/></clipPath>
    <clipPath id="ct"><rect x="0" y="0" width="172" height="226" rx="2"/></clipPath>
    <clipPath id="cl"><rect x="0" y="0" width="268" height="166" rx="2"/></clipPath>
    <g id="site">
      <rect width="300" height="22" fill="#141D29"/>
      <rect x="10" y="8" width="40" height="6" rx="3" fill="#00E5FF"/>
      <rect class="hero" y="22" width="300" height="90"/>
      <rect x="14" y="44" width="120" height="12" rx="3" fill="#F4F8FC" opacity=".85"/>
      <rect x="14" y="62" width="80" height="8" rx="3" fill="#F4F8FC" opacity=".4"/>
      <rect x="14" y="80" width="54" height="16" rx="2" fill="#00E5FF"/>
      <rect class="blk" x="14" y="128" width="130" height="70" rx="2"/>
      <rect class="blk" x="154" y="128" width="130" height="70" rx="2"/>
      <rect x="14" y="214" width="200" height="8" rx="3" fill="#F4F8FC" opacity=".3"/>
      <rect x="14" y="230" width="160" height="8" rx="3" fill="#F4F8FC" opacity=".3"/>
      <rect class="blk" x="14" y="252" width="270" height="80" rx="2"/>
      <rect class="hero" y="350" width="300" height="120"/>
      <rect x="14" y="380" width="150" height="12" rx="3" fill="#F4F8FC" opacity=".7"/>
      <rect class="blk" x="14" y="404" width="84" height="50" rx="2"/>
      <rect class="blk" x="108" y="404" width="84" height="50" rx="2"/>
      <rect class="blk" x="202" y="404" width="84" height="50" rx="2"/>
      <rect class="blk" x="14" y="490" width="270" height="110" rx="2"/>
      <rect x="14" y="616" width="120" height="8" rx="3" fill="#F4F8FC" opacity=".3"/>
    </g>
  </defs>

  <rect width="1280" height="440" fill="#080D14"/>
  <g opacity=".5">
    <path class="tick" d="M0 28H1280"/>
    <g class="tick">
      <path d="M40 18v10M80 22v6M120 22v6M160 22v6M200 18v10M240 22v6M280 22v6M320 22v6M360 18v10M400 22v6M440 22v6M480 22v6M520 18v10M560 22v6M600 22v6M640 22v6M680 18v10M720 22v6M760 22v6M800 22v6M840 18v10M880 22v6M920 22v6M960 22v6M1000 18v10M1040 22v6M1080 22v6M1120 22v6M1160 18v10M1200 22v6M1240 22v6"/>
    </g>
  </g>

  <text class="t" x="64" y="150" fill="#00E5FF" font-size="15" font-weight="600" letter-spacing="3">NERUZ EXTENSIONS · OPEN SOURCE</text>
  <text class="t" x="62" y="210" fill="#F4F8FC" font-size="58" font-weight="700">Neruz Page View</text>
  <text class="t" x="64" y="254" fill="#A9B8C8" font-size="21">Your site on many screens at once.</text>
  <text class="t" x="64" y="284" fill="#A9B8C8" font-size="21">Screenshots, videos and mockups. Free and 100% local.</text>
  <g transform="translate(64 322)">
    <rect width="96" height="30" rx="2" fill="none" stroke="#304256"/>
    <text class="t" x="48" y="20" fill="#F4F8FC" font-size="13" text-anchor="middle">MIT</text>
    <rect x="108" width="150" height="30" rx="2" fill="none" stroke="#304256"/>
    <text class="t" x="183" y="20" fill="#F4F8FC" font-size="13" text-anchor="middle">Chrome · Edge · Firefox</text>
    <rect x="270" width="112" height="30" rx="2" fill="none" stroke="#304256"/>
    <text class="t" x="326" y="20" fill="#F4F8FC" font-size="13" text-anchor="middle">pt · en · es</text>
  </g>

  <g transform="translate(640 96)">
    <rect class="dev act" x="-8" y="-8" width="108" height="206" rx="14"/>
    <g clip-path="url(#cp)"><g transform="scale(.31)"><g class="page"><use href="#site"/></g></g></g>
    <text class="t" x="46" y="226" fill="#00E5FF" font-size="12" text-anchor="middle">393 px</text>
  </g>
  <g transform="translate(776 78)">
    <rect class="dev" x="-8" y="-8" width="188" height="242" rx="10"/>
    <g clip-path="url(#ct)"><g transform="scale(.58)"><g class="page"><use href="#site"/></g></g></g>
    <text class="t" x="86" y="262" fill="#5D7186" font-size="12" text-anchor="middle">820 px</text>
  </g>
  <g transform="translate(990 104)">
    <rect class="dev" x="-8" y="-8" width="284" height="182" rx="6"/>
    <path d="M-30 174h336l-14 14H-16z" fill="#141D29" stroke="#304256" stroke-width="2"/>
    <g clip-path="url(#cl)"><g transform="scale(.9)"><g class="page"><use href="#site"/></g></g></g>
    <text class="t" x="134" y="216" fill="#5D7186" font-size="12" text-anchor="middle">1440 px</text>
  </g>

  <g transform="translate(620 0)"><g class="scan">
    <path d="M0 60V360" stroke="#00E5FF" stroke-width="1.5" opacity=".8"/>
    <path d="M-5 60h10M-5 360h10" stroke="#00E5FF" stroke-width="1.5"/>
  </g></g>

  <g transform="translate(640 392)">
    <rect class="w" width="600" height="2" fill="#00E5FF" style="transform-origin:0 0"/>
    <circle class="blink" cx="-14" cy="1" r="5" fill="#FF4D5E"/>
    <text class="t" x="600" y="26" fill="#5D7186" font-size="12" text-anchor="end">screenshot · video · frame · multiple pages</text>
  </g>
</svg>
